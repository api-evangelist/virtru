problems:
  - code: invalid_argument
    http: 400
    title: Invalid argument
    remediation: Correct malformed request fields (attribute FQN, policy IDs, selectors).
  - code: unauthenticated
    http: 401
    title: Missing or invalid OIDC token
    remediation: Obtain a fresh Bearer token from the configured IdP and retry.
  - code: permission_denied
