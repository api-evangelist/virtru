  uniform error envelope (`connect.error`) with a `code` (Connect/gRPC canonical code) and a
  human-readable `message`, rather than per-status RFC 9457 problem+json documents. The
  envelope is declared as the `default` (Error) response on all 116 operations across the
  15 OpenAPI specs in this repo.
envelope:
