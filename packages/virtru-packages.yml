description: >-
  First-party client libraries for the Virtru Data Security Platform, published
  under the OpenTDF project that Virtru maintains. All SDKs connect to the
  Data Security Platform via OIDC, create/read TDF (Trusted Data Format) objects,
  and enforce attribute-based access control.
