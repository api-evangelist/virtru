aid: virtru
name: Virtru
description: Virtru is a data-centric security company whose Data Security Platform is built on OpenTDF,
  the open Trusted Data Format. Applications encrypt data with attribute-based access control (ABAC) and
  enforce who can decrypt it through Key Access Servers (KAS), independent of where the data travels —
  email, files, SaaS, and data pipelines. The platform exposes Connect-protocol (gRPC + HTTP/JSON) services
  for policy (namespaces, attributes, values, subject mappings), key access, authorization decisions,
  and entity resolution, authenticated with OIDC/OAuth 2.0. Virtru maintains the open-source OpenTDF project
  and ships SDKs for JavaScript, Go, and Java plus the otdfctl CLI. Backed by Bessemer Venture Partners
  and ICONIQ Capital.
